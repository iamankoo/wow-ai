services:
  - type: web
    name: wow-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      # Set manually in the Render dashboard (Environment tab) - a Neon
      # free-tier Postgres connection string, since Render allows only one
      # active free-tier database per account and this project doesn't need
      # a second Render-managed one. Never committed to git as plaintext.
      - key: DATABASE_URL
        sync: false
      - key: MEMORY_EMBEDDING_DIM
        value: 384
      - key: SECRET_KEY
        generateValue: true
      # Zero-ML-dependency defaults. Reverted here after a real production
      # incident (see docs/DEPLOYMENT.md "Free-tier resource ceiling,
      # measured"): STT_PROVIDER=local_whisper (even the "tiny" model)
      # loads fine at boot but OOM-crashed the whole process the moment it
      # actually ran inference on real audio, taking the entire backend
      # down with it (confirmed live - /health itself stopped responding).
      # MODEL_PROVIDER=local_wow was never enabled here at all: Brain v3's
      # real weights measure 1.56GB on disk (3 heads x ~520MB), over 3x
      # the free plan's entire RAM budget on their own.
      - key: MODEL_PROVIDER
        value: rule_based
      - key: STT_PROVIDER
        value: simulated
      - key: TTS_PROVIDER
        value: simulated
      - key: AGENT_RUNTIME
        value: wow_brain
      - key: OTP_EXPOSE_DEV_CODE
        value: "true"
      - key: CALL_RETENTION_DAYS
        value: 15
