services:
  - type: web
    name: wow-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      # Set manually in the Render dashboard (Environment tab) - a Neon
      # free-tier Postgres connection string, since Render allows only one
      # active free-tier database per account and this project doesn't need
      # a second Render-managed one. Never committed to git as plaintext.
      - key: DATABASE_URL
        sync: false
      - key: MEMORY_EMBEDDING_DIM
        value: 384
      - key: SECRET_KEY
        generateValue: true
      # MODEL_PROVIDER stays rule_based: Brain v3's real weights (1.56GB -
      # 3 heads x ~520MB) cannot fit in the free plan's 512MB RAM, measured
      # directly on disk - not a guess. See docs/DEPLOYMENT.md.
      - key: MODEL_PROVIDER
        value: rule_based
      # Real self-hosted STT/TTS (never a hosted AI API) - both are small
      # enough to fit the free plan's RAM: faster-whisper's "tiny"
      # multilingual model quantized int8 (~75MB) and Piper's ONNX voices
      # (~60-75MB each, loaded lazily on first use, not at boot). See
      # docs/DEPLOYMENT.md for why MODEL_PROVIDER can't join them here.
      - key: STT_PROVIDER
        value: local_whisper
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: TTS_PROVIDER
        value: local_piper
      - key: AGENT_RUNTIME
        value: wow_brain
      - key: OTP_EXPOSE_DEV_CODE
        value: "true"
      - key: CALL_RETENTION_DAYS
        value: 15
